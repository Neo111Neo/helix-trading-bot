mode: paper
venue: hyperliquid
perp_trading: true
network: mainnet
market:
  coins: [BTC, ETH, SOL]
  decision_interval_ms: 1000
  horizon_s: 60
server:
  host: 127.0.0.1
  port: 8787
  open_browser: true
